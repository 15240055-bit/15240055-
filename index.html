<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？抽籤器</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --text: #352b25;
      --muted: #766b62;
      --accent: #e87945;
      --accent-dark: #c85e2d;
      --line: #eadfd4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #fff8ef, #ffe9d8);
      color: var(--text);
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    }

    .app {
      width: min(100%, 520px);
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(92, 58, 34, .10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 2.3rem);
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 14px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffdfb;
      color: var(--text);
      font: inherit;
      line-height: 1.8;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 121, 69, .14);
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: scale(.99); }

    .result {
      margin-top: 22px;
      padding: 22px 16px;
      border: 1px dashed #edbd9f;
      border-radius: 16px;
      background: #fff8f2;
      text-align: center;
    }

    .result-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .9rem;
    }

    #resultText {
      display: block;
      min-height: 1.6em;
      color: var(--accent-dark);
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: #b54732;
      text-align: center;
      font-size: .92rem;
    }

    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>今天吃什麼？</h1>
    <p class="intro">把選項交給命運，今天就這麼決定！</p>

    <label for="options">想吃的選項（每行一個）</label>
    <textarea id="options" placeholder="例如：&#10;便當&#10;麵&#10;咖哩&#10;水餃">便當
麵
咖哩
水餃</textarea>

    <button id="drawButton" type="button">幫我選</button>

    <section class="result" aria-live="polite" aria-atomic="true">
      <span class="result-label">今天就決定吃這個！</span>
      <strong id="resultText">等你來抽籤 🍽️</strong>
    </section>
    <p id="message" role="status"></p>
    <p class="hint">空白行會自動忽略，完全相同的重複選項只會保留一個。</p>
  </main>

  <script>
    const optionsInput = document.getElementById("options");
    const drawButton = document.getElementById("drawButton");
    const resultText = document.getElementById("resultText");
    const message = document.getElementById("message");

    drawButton.addEventListener("click", () => {
      // 去除每行前後空白、忽略空白行，並移除完全相同的重複選項。
      const options = [...new Set(
        optionsInput.value
          .split(/\r?\n/)
          .map(option => option.trim())
          .filter(option => option.length > 0)
      )];

      if (options.length === 0) {
        resultText.textContent = "尚未抽出結果";
        message.textContent = "請先輸入至少一個選項";
        return;
      }

      // 每個有效選項在陣列中只出現一次，因此抽中機率相同。
      const randomIndex = Math.floor(Math.random() * options.length);
      resultText.textContent = options[randomIndex];
      message.textContent = `從 ${options.length} 個有效選項中抽出！`;
    });
  </script>
</body>
</html>
